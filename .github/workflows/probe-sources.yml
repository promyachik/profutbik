name: Probe sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        run: |
          python - <<'PY'
          import json, ssl, time, urllib.request, urllib.error
          ctx = ssl.create_default_context()
          UA = {"User-Agent": "Mozilla/5.0", "Accept": "application/json"}

          def probe(label, url, headers=UA, want_json=True):
              t0 = time.time()
              try:
                  req = urllib.request.Request(url, headers=headers)
                  with urllib.request.urlopen(req, timeout=30, context=ctx) as r:
                      body = r.read()
                  ms = int((time.time()-t0)*1000)
                  extra = ""
                  if want_json:
                      try:
                          d = json.loads(body)
                          extra = "ключи: %s" % list(d)[:3]
                      except Exception:
                          extra = "НЕ JSON (первые 60 байт): %r" % body[:60]
                  else:
                      extra = "%d байт" % len(body)
                  print("OK   %-34s %s %6dms  %s" % (label, r.status, ms, extra))
              except urllib.error.HTTPError as e:
                  print("HTTP %-34s %s  %s" % (label, e.code, e.reason))
              except Exception as e:
                  print("FAIL %-34s %s" % (label, str(e)[:90]))

          B = "https://tmapi-alpha.transfermarkt.technology"
          probe("TM: клуб",            B + "/club/11")
          probe("TM: состав",          B + "/club/11/squad")
          probe("TM: история цены",    B + "/player/357565/market-value-history")
          probe("TM: таблица лиги",    B + "/competition/GB1/table")
          probe("TM CDN: герб",        "https://tmssl.akamaized.net/images/wappen/homepageWappen150x150/11.png", want_json=False)
          probe("TM CDN: портрет",     "https://img.a.transfermarkt.technology/portrait/big/342229-1.png", want_json=False)
          probe("API-Football CDN",    "https://media.api-sports.io/football/teams/34.png", want_json=False)
          probe("CFTC (COT)",          "https://publicreporting.cftc.gov/resource/6dca-aqww.json?$limit=1")
          probe("RSS BBC",             "https://feeds.bbci.co.uk/sport/football/rss.xml", want_json=False)
          probe("RSS Guardian",        "https://www.theguardian.com/football/rss", want_json=False)
          probe("RSS Sky",             "https://feeds.skynews.com/feeds/rss/sports.xml", want_json=False)
          probe("RSS Championat",      "https://www.championat.com/rss/news/football/", want_json=False)
          PY
