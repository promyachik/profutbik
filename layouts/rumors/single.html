{{ define "main" }}
<article class="pf405a-rumor-article">
<style id="pf405a-rumor-article-style">
.pf405a-rumor-article{width:min(980px,calc(100% - 28px));margin:0 auto;padding:34px 0 54px;font-family:Roboto,Arial,sans-serif;color:#edf1f4}
.pf405a-rumor-article *{box-sizing:border-box}.pf405a-back{display:inline-flex;margin-bottom:26px;color:#ffd400;font-size:14px;font-weight:700;text-decoration:none}
.pf405a-head{display:grid;grid-template-columns:84px minmax(0,1fr) 84px;gap:22px;align-items:center;padding:28px;border:1px solid rgba(130,145,160,.24);background:rgba(8,13,18,.42)}
.pf405a-head-logo{width:78px;height:78px;display:grid;place-items:center}.pf405a-head-logo img{display:block;max-width:74px;max-height:74px;width:auto;height:auto;object-fit:contain}
.pf405a-head-copy{text-align:center}.pf405a-head-date{display:block;margin-bottom:9px;color:#aeb8c2;font-size:13px}.pf405a-head-title{margin:0;font-size:clamp(27px,4vw,44px);line-height:1.08;font-weight:850}.pf405a-head-desc{margin:16px 0 0;color:#bcc5ce;font-size:16px;line-height:1.5}
.pf405a-body{padding:30px 28px 8px;border:1px solid rgba(130,145,160,.24);border-top:0;background:rgba(8,13,18,.25)}.pf405a-body p{margin:0 0 22px;color:#d7dde2;font-size:17px;line-height:1.72}

.pf405a-links{display:flex;gap:10px;justify-content:flex-start;margin:24px 0 18px}.pf405a-links a{display:inline-flex;padding:8px 14px;border:1px solid rgba(255,212,0,.58);color:#f2f4f6;font-size:13px;font-weight:700;text-decoration:none}.pf405a-links a:hover{border-color:#ffd400;color:#ffd400}
body:has(.pf405a-rumor-article) .bottom-transfer-strip-v3:not(.home-player-bottom-strip){display:none!important}
body:has(.pf405a-rumor-article) .home-player-bottom-strip{position:relative!important;left:auto!important;width:100vw!important;max-width:100vw!important;margin-left:calc(50% - 50vw)!important;transform:none!important}
</style>
<a class="pf405a-back" href="{{ "rumors/" | relURL }}">← Все слухи</a>
<header class="pf405a-head"><span class="pf405a-head-logo"><img src="{{ .Params.from_logo | relURL }}" alt="{{ .Params.from_club }}"></span><span class="pf405a-head-copy"><time class="pf405a-head-date">{{ .Params.display_date }}</time><h1 class="pf405a-head-title">{{ .Title }}</h1><p class="pf405a-head-desc">{{ .Description }}</p></span><span class="pf405a-head-logo"><img src="{{ .Params.to_logo | relURL }}" alt="{{ .Params.to_club }}"></span></header>
<div class="pf405a-body">{{ .Content }}<nav class="pf405a-links"><a href="{{ "transfers/" | relURL }}">Трансферы</a><a href="{{ "rumors/" | relURL }}">Все слухи</a></nav></div>
</article>
{{ partial "home-player-bottom-strip.html" . }}
<span hidden id="pf405a-rumor-article-marker">PF405A_RUMOR_ARTICLE</span>
{{ end }}
