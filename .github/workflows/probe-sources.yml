name: Probe sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe mirrors
        run: |
          python - <<'PY'
          import ssl, time, re, urllib.request, urllib.error
          ctx = ssl.create_default_context()
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept-Language": "en-US,en;q=0.9"}
          MIRRORS = ["com","de","co.uk","es","it","fr","com.tr","com.br","nl","pl","at","ch",
                     "be","pt","com.ar","co.id","us","world","jp","in","gr","dk","se","no",
                     "ru","cz","hu","ro","rs","bg","fi","co.kr","cn","mx","com.co"]
          for m in MIRRORS:
              url = "https://www.transfermarkt.%s/-/profil/spieler/342229" % m
              t0 = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA),
                                              timeout=20, context=ctx) as r:
                      b = r.read()
                  n = len(re.findall(rb'img\.a\.transfermarkt\.technology/portrait/', b))
                  print("MIRROR %-8s %s %5dKB %4dms portrait_links=%d" %
                        (m, r.status, len(b)//1024, int((time.time()-t0)*1000), n))
              except urllib.error.HTTPError as e:
                  print("MIRROR %-8s HTTP %s" % (m, e.code))
              except Exception as e:
                  print("MIRROR %-8s FAIL %s" % (m, str(e)[:50]))
          PY
