name: Probe sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        run: |
          python - <<'PY'
          import json, ssl, time, urllib.request, urllib.error
          ctx = ssl.create_default_context()
          UA = {"User-Agent": "Mozilla/5.0", "Accept": "application/json"}

          def get(label, url, js=False):
              t0 = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA),
                                              timeout=35, context=ctx) as r:
                      b = r.read()
                  ms = int((time.time() - t0) * 1000)
                  print("RESULT OK %s | %s | %dms | %d KB" % (label, r.status, ms, len(b) // 1024))
                  return json.loads(b) if js else b
              except urllib.error.HTTPError as e:
                  print("RESULT HTTP %s | %s %s" % (label, e.code, e.reason))
              except Exception as e:
                  print("RESULT FAIL %s | %s" % (label, str(e)[:80]))
              return None

          API = "https://tmapi-alpha.transfermarkt.technology"
          for pid in ("342229", "724129", "357565"):
              d = get("player-%s" % pid, "%s/player/%s" % (API, pid), js=True)
              if d:
                  u = (d.get("data") or {}).get("portraitUrl")
                  print("RESULT INFO portraitUrl %s | %s" % (pid, u))
                  if u:
                      get("portrait-%s" % pid, u)
          PY
