baseURL = "https://profutbik.ru/"
languageCode = "ru"
title = "ProFutbik"
enableRobotsTXT = true

# PF531I: разделы «Categories» и «Tags» отключены.
#
# Ни одна страница сайта тегов и категорий не использует, но Hugo всё равно
# печатал для них две пустые страницы с английскими заголовками — «Tags on
# ProFutbik» на русском сайте — и клал их в sitemap. Для домена, у которого в
# Search Console ноль проиндексированных страниц, это худший из возможных
# первых кандидатов на обход: пусто, не по-русски, ни одной ссылки внутрь.
#
# robots.txt пытался их закрыть, но по старому пути /promyachik/categories/,
# оставшемуся от прежнего адреса сайта, и не закрывал ничего. Правильнее не
# запрещать обход того, что вообще не должно существовать.
disableKinds = ["taxonomy", "term"]
