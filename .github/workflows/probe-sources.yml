name: Probe sources

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probe
        run: |
          python - <<'PY'
          import ssl, time, re, urllib.request, urllib.error
          ctx = ssl.create_default_context()
          UA = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                              "(KHTML, like Gecko) Chrome/126.0 Safari/537.36",
                "Accept-Language": "ru,en;q=0.9"}

          def get(label, url):
              t0 = time.time()
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=UA),
                                              timeout=35, context=ctx) as r:
                      b = r.read()
                  print("PROBE OK   %-30s %s %6dms  %d KB" % (label, r.status, int((time.time()-t0)*1000), len(b)//1024))
                  return b
              except urllib.error.HTTPError as e:
                  body = b""
                  try: body = e.read()[:120]
                  except Exception: pass
                  print("PROBE HTTP %-30s %s  %s | %r" % (label, e.code, e.reason, body[:100]))
              except Exception as e:
                  print("PROBE FAIL %-30s %s" % (label, str(e)[:90]))
              return None

          b = get("HTML профиля игрока", "https://www.transfermarkt.com/-/profil/spieler/342229")
          if b:
              m = list(dict.fromkeys(re.findall(
                  rb'https://img\.a\.transfermarkt\.technology/portrait/[^"\'<>\s]+', b)))
              print("PROBE INFO ссылок на портрет: %d" % len(m))
              if m:
                  u = m[0].decode()
                  print("PROBE INFO пример: %s" % u)
                  get("портрет по ссылке", u)
          get("HTML поиска", "https://www.transfermarkt.com/schnellsuche/ergebnis/schnellsuche?query=mbappe")
          PY
