name: Autopilot tick

on:
  schedule:
    # Раз в 30 минут. Один такт = один трансфер: у него пять обязательных
    # частей, и при штучной публикации поломка видна сразу, а откатывается
    # одна транзакция. Плюс домену несколько дней — сайт, получающий десятки
    # страниц в час, для поиска выглядит свалкой.
    #
    # PF518B: минуты 9 и 39, а не 0 и 30. У GitHub `schedule` работает «по
    # возможности» и в самые загруженные минуты часа слоты просто не
    # выдаются — это описано у них в документации прямым текстом. Замер за
    # 16 часов: из 32 положенных прогонов состоялось шесть, и **все шесть**
    # пришлись на слот :30, ни один слот :00 не доехал вовсе. Круглые минуты —
    # худшее, что можно выбрать.
    - cron: "9,39 * * * *"
  workflow_dispatch:
    inputs:
      discovery:
        description: "Читать ленты (нет — работать только с очередью)"
        type: boolean
        default: true

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.163.3
      PROMYACHIK_SITE: ${{ github.workspace }}
      PROMYACHIK_PARSER: ${{ github.workspace }}/autopilot
      PROMYACHIK_WORK: ${{ github.workspace }}/autopilot/work
      PROMYACHIK_ENGINE: ${{ github.workspace }}/autopilot/engine/transfer-news-4-step-pipeline.py
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Hugo
        run: |
          wget -q -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: autopilot/requirements.txt

      - name: Install dependencies
        run: pip install -q -r autopilot/requirements.txt

      # Модель вырезания фона весит 176 МБ и качается при первом же вызове
      # rembg. Такт идёт каждые полчаса — без кэша это 8 ГБ трафика в сутки
      # и лишние минуты на каждом прогоне.
      - name: Кэш модели u2net
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-model-v1

      - name: Tick
        run: |
          if [ "${{ github.event.inputs.discovery }}" = "false" ]; then
            python autopilot/bin/autopilot_tick.py --no-discovery
          else
            python autopilot/bin/autopilot_tick.py
          fi

      - name: Commit
        run: |
          git config user.name "profutbik-autopilot"
          git config user.email "autopilot@profutbik.ru"
          git add -A
          if git diff --cached --quiet; then
            echo "изменений нет — такт прошёл вхолостую"
            exit 0
          fi
          NEW=$(git diff --cached --name-only | grep -c '^content/transfers/' || true)
          git commit -q -m "Автопилот: такт $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Раннер одноразовый: если push не прошёл, вся работа такта пропадает
          # вместе с ним. А не пройти он может запросто — достаточно, чтобы в
          # эти же секунды кто-то запушил своё, и ветка уедет вперёд. Именно так
          # 2026-09-05 потерялись два опубликованных трансфера и слух: движок
          # отработал начисто, а push отклонили.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "запушено с попытки $attempt"
              exit 0
            fi
            echo "push отклонён, подтягиваю чужие изменения (попытка $attempt)"
            git pull --rebase --autostash origin main || exit 1
            sleep $((attempt * 5))
          done
          echo "не удалось запушить за пять попыток"
          exit 1
