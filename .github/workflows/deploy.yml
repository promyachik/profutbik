name: Publish site

on:
  push:
    branches: [main]
  # Push, сделанный встроенным токеном Actions, намеренно не запускает другие
  # workflow — так GitHub защищается от бесконечной цепочки. Из-за этого
  # трансфер, опубликованный автопилотом, ложился в репозиторий и на сайт не
  # попадал. Отдельным поводом ловим завершение такта.
  workflow_run:
    workflows: ["Autopilot tick"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Такт, завершившийся отказом, сайт не менял — пересобирать нечего.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    env:
      HUGO_VERSION: 0.163.3
    steps:
      - name: Install Hugo
        run: |
          wget -q -O hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i hugo.deb

      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        run: hugo --minify --logLevel info

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
